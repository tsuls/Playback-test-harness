# Runs the whole suite on two platforms, Linux + Chromium and Windows + Edge,
# then reports one overall result: the `CI passed` check.
#
# GitHub Actions basics: a *workflow* (this file) has *jobs*; each job runs on a
# fresh virtual machine (`runs-on`) and executes its *steps* in order. A step
# either runs a shell command (`run`) or reuses a published action (`uses`).
# Jobs run in parallel unless one `needs` another.

name: CI

on:
  # Pushes to a PR branch are already covered by `pull_request`; also running on
  # every push would report each job twice. So `push` is only for main.
  push:
    branches: [main]
  pull_request:

# The jobs only need to read the repository.
permissions:
  contents: read

jobs:
  playback:
    # A *matrix* runs this one job definition once per entry, in parallel:
    # same steps, different machine. Each entry shows up as its own job.
    strategy:
      # Let every platform finish even if another fails, so each one reports.
      fail-fast: false
      matrix:
        include:
          - platform: linux-chromium
            os: ubuntu-latest
          - platform: windows-edge
            os: windows-latest
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Run every `run:` step with bash (Git Bash on Windows, preinstalled on
    # GitHub's Windows machines), so the commands are identical on both.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version the suite was developed and verified on.
          node-version: 22
          # Caches npm's download cache between runs, keyed on package-lock.json.
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, and fails if
      # package.json and the lock file disagree.
      - run: npm ci

      # Linux needs Playwright's Chromium plus the system libraries it runs on.
      # Windows needs nothing: the `edge` project uses the preinstalled Edge.
      - name: Install Chromium
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc

      # --repeat-each=3 runs every test three times, so each CI run also produces
      # flake data. With `retries: 1` in the config, a test that fails and then
      # passes on retry is reported as flaky and does NOT fail the job; a test
      # that fails both attempts does. playwright.config.ts picks the browser
      # project from the OS (chromium on Linux, edge on Windows).
      - name: Run tests
        run: npx playwright test --repeat-each=3

      # The steps below run even if the tests failed (but not if the run was
      # cancelled): failures are exactly when the reports matter most. Each
      # report is its own step, so one failing script can't hide the other.
      - name: Flake report → job summary
        if: ${{ !cancelled() }}
        run: npx tsx scripts/flake-report.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Metrics report → job summary
        if: ${{ !cancelled() }}
        run: npx tsx scripts/metrics-report.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.platform }}
          path: playwright-report/
          retention-days: 14

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.platform }}
          path: results/
          retention-days: 14

  # The single check the merge ruleset requires. Adding a platform to the matrix
  # then never means editing the ruleset.
  ci-passed:
    name: CI passed
    needs: playback
    # Run even when a platform failed; otherwise this job is skipped, and GitHub
    # treats a skipped required check as passing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # needs.playback.result is "success" only if every matrix entry succeeded.
      - run: test "${{ needs.playback.result }}" = success
